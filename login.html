<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Login - Baatify</title>
<script>

window.V="?v="+Date.now();
["css/style.css","css/auth.css"].forEach(function(f){
  document.write('<link rel="stylesheet" href="'+f+window.V+'">');
});
</script>
<script>document.addEventListener("gesturestart",function(e){e.preventDefault()});</script>
</head>
<body>
<main class="card">
  <div class="logo-img">
    <img src="/assets/Pin code Password Protection, Secure Login animation.svg" alt="Secure Login" style="width: 150px; height: auto;">
  </div>
  <h1>Welcome back</h1>
  <p class="tag">Login to continue</p>
  <form id="form" class="col" novalidate>
    <input id="u" placeholder="Username" autocapitalize="off" autocomplete="username" aria-label="Username">
    <div class="pw">
      <input id="p" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <button type="button" id="eye" class="eye">Show</button>
    </div>
    <button class="btn" id="go">Login</button>
  </form>
  <div id="err" role="alert"></div>
  <p class="alt">New here? <a href="register">Create account</a></p>
</main>
<script>import("./js/login.js"+window.V)</script>
</body>
</html>
