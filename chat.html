<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111b21">
<title>Chats - Baatify</title>

<link rel="preload" as="image" href="assets/loading.svg">
<style>
#mtBoot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#111b21;transition:opacity .25s}
@media(prefers-color-scheme:light){#mtBoot{background:#fff}}
#mtBoot.out{opacity:0;pointer-events:none}
#mtBoot img{width:250px;height:250px}
</style>
<!-- Auto version: har reload par naya number, to ?v= haath se nahi badalna -->
<script>
window.V="?v="+Date.now();
document.write('<link rel="stylesheet" href="css/chat.css'+window.V+'">');
document.write('<link rel="stylesheet" href="css/motion.css'+window.V+'">');
</script>
</head>
<body>

<div id="mtBoot" role="status" aria-label="Loading"><img src="assets/loading.svg" alt="" width="250" height="250"></div>
<script>window.__mtT=performance.now()</script>

<!-- Vector icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></symbol>
    <symbol id="i-videooff" viewBox="0 0 24 24"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></symbol>
    <symbol id="i-micoff" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23M12 19v4M8 23h8"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
        <g transform="translate(-3 0) rotate(45 12 12)">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
     <symbol id="i-check2" viewBox="0 0 24 24"><path d="M1 13l4.5 4.5L15 8"/><path d="M9 15.5l2 2L22 7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="i-reply" viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
    <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  </defs>
</svg>

<div id="app">

  <!-- Left: profile, search, chat list -->
  <aside id="side">
    <header>
      <button class="av" id="me" type="button" aria-label="Open profile"></button>
      <b id="mn"></b>
      <button class="ic hide" id="adm" type="button" aria-label="Admin panel"><svg class="i"><use href="#i-shield"/></svg></button>
<button class="ic" id="out" type="button" aria-label="Logout"><svg class="i"><use href="#i-logout"/></svg></button>
    </header>
    <div class="sbox">
      <svg class="i s-ic"><use href="#i-search"/></svg>
      <input id="q" placeholder="Search by username" autocomplete="off" aria-label="Search users">
    </div>
    <div id="res" class="hide"></div>
    <div id="list"></div>
  </aside>

  <!-- Right: conversation -->
  <section id="chat">
    <div id="empty">
      <div class="logo">B</div>
      <h2>Baatify</h2>
      <p>Search a username to start chatting.</p>
    </div>

    <div id="pane" class="hide">

      <!-- Normal header -->
      <header id="phead">
        <button class="ic" id="back" type="button" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button>
        <div id="oa" class="av"></div>
        <div class="who"><b id="on"></b><small id="os"></small></div>
        <button class="ic" id="ca" type="button" aria-label="Audio call"><svg class="i"><use href="#i-phone"/></svg></button>
        <button class="ic" id="cv" type="button" aria-label="Video call"><svg class="i"><use href="#i-video"/></svg></button>
        <button class="ic" id="mm" type="button" aria-label="More options"><svg class="i"><use href="#i-more"/></svg></button>
      </header>

      <!-- Message select bar (message par tap karne par) -->
      <header id="selbar" class="hide">
        <button class="ic" id="sx" type="button" aria-label="Cancel selection"><svg class="i"><use href="#i-x"/></svg></button>
        <b>1 selected</b>
        <button class="ic" id="sr" type="button" aria-label="Reply"><svg class="i"><use href="#i-reply"/></svg></button>
        <button class="ic" id="scp" type="button" aria-label="Copy"><svg class="i"><use href="#i-copy"/></svg></button>
        <button class="ic" id="se" type="button" aria-label="Edit"><svg class="i"><use href="#i-edit"/></svg></button>
        <button class="ic" id="sd" type="button" aria-label="Delete"><svg class="i"><use href="#i-trash"/></svg></button>
      </header>

      <!-- 3-dot menu -->
      <div id="menu" class="hide" role="menu">
        
        <button type="button" id="m1">Clear chat</button>
        <button type="button" id="m2">Delete chat</button>
        <button type="button" id="m4" class="hide">Request a photo</button>
        <button type="button" id="m3">Log out</button>
      </div>

      <div id="msgs" aria-live="polite"></div>

      <div id="rbar" class="hide">
        <div class="rq"><b id="rn"></b><span id="rt"></span></div>
        <img id="rth" class="hide" alt="">
        <button class="ic" id="rx" type="button" aria-label="Cancel"><svg class="i"><use href="#i-x"/></svg></button>
      </div>

      <div id="emo" class="hide"></div>

      <div id="f">
        <button type="button" class="ic" id="eb" aria-label="Emoji"><svg class="i"><use href="#i-smile"/></svg></button>
        <button type="button" class="ic" id="clip" aria-label="Send photo"><svg class="i"><use href="#i-clip"/></svg></button>
        <textarea id="in" rows="1" placeholder="Type a message" aria-label="Message"></textarea>
        <button type="button" id="send" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button>
        <button type="button" id="mic" aria-label="Record voice message"><svg class="i"><use href="#i-mic"/></svg></button>
      </div>
        <div id="rec" class="hide">
          <button type="button" class="ic" id="rcx" aria-label="Cancel recording"><svg class="i"><use href="#i-trash"/></svg></button>
          <span class="dot"></span><span id="rtime">0:00 / 1:00</span>
          <button type="button" id="rsend" aria-label="Send voice message"><svg class="i"><use href="#i-send"/></svg></button>
        </div>
        <!-- Contact info -->
      <div id="pinfo" class="hide">
        <header>
          <button class="ic" id="pibk" type="button" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button>
          <b>Contact info</b>
        </header>
        <div class="pbody">
          <div id="pia" class="av pbig" role="button" tabindex="0" aria-label="View photo"></div>
          <div class="pn" id="pin"></div>
          <div class="pu" id="piu"></div>
          <div class="ps" id="pis"></div>
          <div class="pacts">
            <button class="pa" id="pica" type="button"><svg class="i"><use href="#i-phone"/></svg><span>Audio</span></button>
            <button class="pa" id="picv" type="button"><svg class="i"><use href="#i-video"/></svg><span>Video</span></button>
          </div>
          <div class="pcard"><small>Joined</small><div id="pij"></div></div>
        </div>
      </div>
    </div>
  </section>
</div>

<input type="file" id="file" accept="image/*,video/*" class="hide">

<!-- Photo viewer -->
<div id="view" class="hide">
  <button class="vb" id="vx" type="button" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
  <button class="vb" id="dl" type="button" aria-label="Download"><svg class="i"><use href="#i-download"/></svg></button>
  <img id="vimg" alt="Photo">
</div>

<!-- Confirm sheet -->
<div id="sheet" class="hide">
  <div class="sbox2">
    <p id="st"></p>
    <div class="sbtn">
      <button type="button" id="sno">Cancel</button>
      <button type="button" id="syes" class="dng">Delete</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<!-- JS bhi har reload par naya -->
<script>import("./js/chat.js"+window.V);import("./js/motion.js"+window.V);import("./js/hdsvg.js"+window.V)</script>
</body>
</html>
