<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up - Baatify</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<main class="card">
  <div class="logo">B</div>
  <h1>Create account</h1>
  <p class="tag">Free, takes 20 seconds</p>
  <form id="form" class="col" novalidate>
    <input id="n" placeholder="Your name" autocomplete="name" aria-label="Your name">
    <div>
      <input id="u" placeholder="Choose a username" autocapitalize="off" autocomplete="username" aria-label="Username">
      <div id="hint" class="hint"></div>
    </div>
    <div class="pw">
      <input id="p" type="password" placeholder="Password (6+ characters)" autocomplete="new-password" aria-label="Password">
      <button type="button" id="eye" class="eye">Show</button>
    </div>
    <button class="btn" id="go">Create account</button>
  </form>
  <div id="err" role="alert"></div>
  <p class="alt">Already have an account? <a href="login.html">Login</a></p>
</main>
<script type="module" src="js/register.js"></script>
</body>
</html>
