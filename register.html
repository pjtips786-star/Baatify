<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up - Baatify</title>
<script>
window.V="?v="+Date.now();
["css/style.css","css/auth.css"].forEach(function(f){
  document.write('<link rel="stylesheet" href="'+f+window.V+'">');
});
</script>
</head>
<body>
<main class="card">
  <div class="logo-img">
    <img src="/assets/Sign up.svg" alt="Secure sign up" style="width: 150px; height: auto;">
  </div>
  <h1>Create account</h1>
  <form id="form" class="col" novalidate>
    <input id="n" placeholder="Your name" autocomplete="name" aria-label="Your name">
    <div>
      <input id="u" placeholder="Choose a username" autocapitalize="off" autocomplete="username" aria-label="Username">
      <div id="hint" class="hint"></div>
    </div>
    <div class="pw">
      <input id="p" type="password" placeholder="Password (6+ characters)" autocomplete="new-password" aria-label="Password">
      <button type="button" id="eye" class="eye">Show</button>
    </div>
    <button class="btn" id="go">Create account</button>
  </form>
  <div id="err" role="alert"></div>
  <p class="alt">Already have an account? <a href="login.html">Login</a></p>
</main>
<script>import("./js/register.js"+window.V)</script>
</body>
</html>
