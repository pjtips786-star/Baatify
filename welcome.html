<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baatify - Welcome Mahal</title>
<style>
:root{box-sizing:border-box;color-scheme:dark}
body{margin:0;min-height:100vh;background:#1f0718;overflow:hidden}
</style>
</head>
<body>
<script>
/* ===== Baatify welcome.js: ribbon cutting + welcome mahal ===== */
(function(){
"use strict";

/* ====== SIRF YAHAN BADLO ====== */
var NAME="Aapka Naam";
var MSG="Ye mahal maine sirf aapke liye banaya hai.\nIska pehla darwaza aapke haath se khula,\nab ye aapka apna hai.";
var GO_URL="login.html";
/* ============================== */

var KEY="wm_state",q=new URLSearchParams(location.search);
var preview=q.has("preview");
var RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
var COLORS=["#ff4f8b","#ff8fb3","#ffc2d6","#fff0f5","#f6d28a","#ff6fa3"];
function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function save(v){if(preview)return;try{localStorage.setItem(KEY,v)}catch(e){}}
if(q.has("reset")){try{localStorage.removeItem(KEY)}catch(e){}}
var state=preview?null:get();
if(state==="in"){location.href=GO_URL;return;}

var CSS=`
.wm{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;overflow:hidden;color:#fff;font-family:"Cormorant Garamond",Georgia,serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:opacity .7s}
.wm *{box-sizing:border-box}
.wm [hidden]{display:none!important}
.wm.out{opacity:0;pointer-events:none}
.wm.instant *{transition:none!important;animation-duration:0s!important}
.wm .sky{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 105%,#ff8db4 0%,#d63b7c 26%,#6b1647 58%,#1f0718 100%)}
.wm .fx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.wm .st{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.8;animation:wmtw var(--d) ease-in-out infinite}
@keyframes wmtw{50%{opacity:.15}}
.wm .pt{position:absolute;top:-6vh;width:var(--s);height:calc(var(--s)*1.35);background:#ffb3cf;border-radius:100% 0 100% 0;opacity:.7;animation:wmfall var(--d) linear infinite;animation-delay:var(--l)}
@keyframes wmfall{to{transform:translate(var(--x),112vh) rotate(480deg)}}
.wm .top{position:relative;z-index:2;flex:none;text-align:center;padding:7vh 20px 0}
.wm .kick{letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:#ffd1e1}
.wm .nm{font-family:"Great Vibes","Brush Script MT",cursive;font-weight:400;font-size:clamp(44px,15vw,76px);line-height:1.1;margin:6px 0 0;background:linear-gradient(180deg,#fff,#ffc2d6 60%,#ff8fb3);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,79,139,.55))}
.wm .sub{font-style:italic;font-size:19px;color:#ffd1e1;margin-top:2px}
.wm .pal{position:relative;z-index:2;flex:1;min-height:0;display:grid;place-items:center}
.wm .pw{position:relative;width:max(220px,min(94vw,440px,calc((100vh - 330px)*1.2)));aspect-ratio:360/300}
.wm .pw>svg{width:100%;height:100%;display:block;overflow:visible}
.wm .dl,.wm .dr{transition:transform 1.5s cubic-bezier(.65,0,.25,1);transform-box:view-box}
.wm .dl{transform-origin:150px 0}
.wm .dr{transform-origin:210px 0}
.wm.open .dl,.wm.open .dr{transform:scaleX(.1)}
.wm .rl,.wm .bm{opacity:0;transition:opacity 1.6s}
.wm.open .rl,.wm.open .bm{opacity:1}
.wm .win{opacity:.5;transition:opacity 1.6s}
.wm.open .win{opacity:1}
.wm .rib{position:absolute;left:50%;top:calc(78% - 18px);width:100vw;height:36px;transform:translateX(-50%);z-index:3}
.wm .rh{position:absolute;top:0;width:50%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 45%,rgba(90,0,40,.25)),#ff5b94;border-top:2px solid #f6d28a;border-bottom:2px solid #f6d28a;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform 1.1s cubic-bezier(.5,0,1,.6),opacity .9s .25s}
.wm .rh.l{left:0;transform-origin:0 50%}
.wm .rh.r{right:0;transform-origin:100% 50%}
.wm.cut .rh.l{transform:rotate(40deg) translateY(40px);opacity:0}
.wm.cut .rh.r{transform:rotate(-40deg) translateY(40px);opacity:0}
.wm .bow{position:absolute;left:50%;top:50%;width:86px;margin:-32px 0 0 -43px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));transition:transform 1s cubic-bezier(.5,0,1,.6),opacity .8s .2s}
.wm.cut .bow{transform:translateY(190px) rotate(28deg);opacity:0}
.wm .sc{position:absolute;left:10px;top:50%;width:64px;height:44px;margin-top:-22px;z-index:5;touch-action:none;cursor:grab;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));animation:wmnudge 1.6s ease-in-out infinite;--a:0deg}
.wm .sc.drag{animation:none;cursor:grabbing}
.wm .sc svg{width:100%;height:100%;overflow:visible;display:block}
.wm .ba{transform:rotate(calc(var(--a) * -1));transform-origin:24px 22px;transform-box:view-box}
.wm .bb{transform:rotate(var(--a));transform-origin:24px 22px;transform-box:view-box}
@keyframes wmnudge{50%{transform:translateX(16px)}}
.wm.cut .sc{animation:none;opacity:0;transform:translateY(-70px) rotate(-18deg);transition:transform .7s,opacity .5s;pointer-events:none}
.wm .bot{position:relative;z-index:2;flex:none;min-height:160px;padding:6px 26px 26px;text-align:center;display:grid;align-content:start;justify-items:center;gap:16px}
.wm .hint{margin:0;font-size:18px;font-style:italic;color:#ffd1e1}
.wm .hint::after{content:" →";display:inline-block;animation:wmarr 1.2s ease-in-out infinite}
@keyframes wmarr{50%{transform:translateX(6px)}}
.wm .msg{margin:0;font-size:21px;line-height:1.55;max-width:420px;white-space:pre-line;text-shadow:0 2px 10px rgba(60,0,30,.6)}
.wm .go{opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s;border:0;border-radius:40px;padding:14px 38px;font:600 19px "Cormorant Garamond",Georgia,serif;color:#fff;background:linear-gradient(180deg,#ff8fb3,#ff4f8b);box-shadow:0 8px 26px rgba(255,79,139,.55);cursor:pointer}
.wm .go.show{opacity:1;transform:none}
.wm .go:focus-visible,.wm .sc:focus-visible,.wm .skip:focus-visible{outline:3px solid #fff;outline-offset:4px}
.wm .skip{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:9;background:rgba(0,0,0,.3);color:#fff;border:0;border-radius:20px;padding:6px 12px;font-size:12px}
.wm .cf{position:absolute;z-index:6;pointer-events:none;width:var(--s);height:calc(var(--s)*1.3);background:var(--c);border-radius:50% 0 50% 0;animation:wmcf var(--t) cubic-bezier(.2,.7,.3,1) forwards}
.wm .cf.ht{background:none;color:var(--c);width:auto;height:auto;border-radius:0;font-size:calc(var(--s)*2);line-height:1}
@keyframes wmcf{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(var(--r)) scale(1);opacity:0}}
@media(max-height:560px){.wm .top{padding-top:2vh}.wm .nm{font-size:40px}.wm .bot{min-height:110px}}
`;

var PALACE=`<svg viewBox="0 0 360 300" aria-hidden="true">
<defs>
<linearGradient id="wmwl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3f7"/><stop offset="1" stop-color="#f4b6cd"/></linearGradient>
<linearGradient id="wmdm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa7c4"/><stop offset="1" stop-color="#e0568a"/></linearGradient>
<linearGradient id="wmdg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6d6b8"/><stop offset="1" stop-color="#e58aab"/></linearGradient>
<radialGradient id="wmrg" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#fff6c9"/><stop offset=".55" stop-color="#ffb3cf"/><stop offset="1" stop-color="#c2336f"/></radialGradient>
<radialGradient id="wmbm" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff0b8" stop-opacity=".9"/><stop offset="1" stop-color="#ff8fb3" stop-opacity="0"/></radialGradient>
<clipPath id="wmar"><path d="M150 270V200a30 30 0 0 1 60 0V270z"/></clipPath>
</defs>
<rect y="268" width="360" height="32" fill="#2a0a20"/>
<rect x="24" y="190" width="312" height="80" fill="url(#wmwl)"/>
<rect x="24" y="150" width="46" height="120" fill="url(#wmwl)"/>
<rect x="290" y="150" width="46" height="120" fill="url(#wmwl)"/>
<rect x="130" y="110" width="100" height="160" fill="url(#wmwl)"/>
<path d="M24 150a23 23 0 0 1 46 0z" fill="url(#wmdm)"/>
<path d="M290 150a23 23 0 0 1 46 0z" fill="url(#wmdm)"/>
<path d="M122 110a58 58 0 0 1 116 0z" fill="url(#wmdm)"/>
<g stroke="#f6d28a" stroke-width="2" fill="#f6d28a"><path d="M47 127v-12M313 127v-12M180 52V28"/><circle cx="47" cy="113" r="3"/><circle cx="313" cy="113" r="3"/><circle cx="180" cy="25" r="4.5"/></g>
<g class="win" fill="#ffd98a">
<path d="M40 200v-22a7 7 0 0 1 14 0v22z"/><path d="M306 200v-22a7 7 0 0 1 14 0v22z"/>
<path d="M84 240v-18a7 7 0 0 1 14 0v18z"/><path d="M112 240v-18a7 7 0 0 1 14 0v18z"/>
<path d="M234 240v-18a7 7 0 0 1 14 0v18z"/><path d="M262 240v-18a7 7 0 0 1 14 0v18z"/>
<path d="M136 190v-16a6 6 0 0 1 12 0v16z"/><path d="M212 190v-16a6 6 0 0 1 12 0v16z"/>
<circle cx="180" cy="138" r="9"/>
</g>
<path d="M150 270V200a30 30 0 0 1 60 0V270z" fill="#3a0b2a"/>
<g clip-path="url(#wmar)"><rect class="rl" x="150" y="170" width="60" height="100" fill="url(#wmrg)"/></g>
<g clip-path="url(#wmar)">
<g class="dl"><rect x="150" y="170" width="30.5" height="100" fill="url(#wmdg)"/><rect x="155" y="195" width="20" height="68" rx="3" fill="none" stroke="#b8506f" stroke-width="1.2"/><circle cx="175" cy="236" r="2.2" fill="#f6d28a"/></g>
<g class="dr"><rect x="179.5" y="170" width="30.5" height="100" fill="url(#wmdg)"/><rect x="185" y="195" width="20" height="68" rx="3" fill="none" stroke="#b8506f" stroke-width="1.2"/><circle cx="185" cy="236" r="2.2" fill="#f6d28a"/></g>
</g>
<rect x="120" y="262" width="120" height="8" fill="#ffc2d6"/><rect x="108" y="270" width="144" height="8" fill="#ffd6e4"/>
<ellipse class="bm" cx="180" cy="276" rx="86" ry="40" fill="url(#wmbm)"/>
</svg>`;

var BOW='<svg class="bow" viewBox="0 0 80 60" aria-hidden="true"><path d="M40 30C22 4 3 8 7 28c3 16 23 12 33 2z" fill="#ff4f8b" stroke="#c71f62" stroke-width="1.5"/><path d="M40 30C58 4 77 8 73 28c-3 16-23 12-33 2z" fill="#ff4f8b" stroke="#c71f62" stroke-width="1.5"/><path d="M36 34 24 58l10-5 4 6z" fill="#ff7aa8" stroke="#c71f62" stroke-width="1.2"/><path d="M44 34 56 58l-10-5-4 6z" fill="#ff7aa8" stroke="#c71f62" stroke-width="1.2"/><ellipse cx="40" cy="30" rx="7" ry="8" fill="#ff8fb3" stroke="#c71f62" stroke-width="1.5"/></svg>';

var SCISSORS='<svg viewBox="0 0 64 44" aria-hidden="true"><g class="ba"><line x1="24" y1="22" x2="62" y2="21" stroke="#f3e6d3" stroke-width="3.2" stroke-linecap="round"/><line x1="24" y1="22" x2="13" y2="12" stroke="#f3e6d3" stroke-width="3" stroke-linecap="round"/><circle cx="9" cy="9" r="6.5" fill="none" stroke="#ff4f8b" stroke-width="3"/></g><g class="bb"><line x1="24" y1="22" x2="62" y2="23" stroke="#e7d6bd" stroke-width="3.2" stroke-linecap="round"/><line x1="24" y1="22" x2="13" y2="32" stroke="#e7d6bd" stroke-width="3" stroke-linecap="round"/><circle cx="9" cy="35" r="6.5" fill="none" stroke="#ff4f8b" stroke-width="3"/></g><circle cx="24" cy="22" r="2.6" fill="#f6d28a"/></svg>';

var HTML='<div class="sky"></div><div class="fx"></div>'+
'<div class="top"><div class="kick">Is mahal ka udghatan</div><h1 class="nm"></h1><div class="sub">aapke haathon se</div></div>'+
'<div class="pal"><div class="pw">'+PALACE+'<div class="rib"><div class="rh l"></div><div class="rh r"></div>'+BOW+
'<div class="sc" role="button" tabindex="0" aria-label="Cut the ribbon">'+SCISSORS+'</div></div></div></div>'+
'<div class="bot"><p class="hint">Kainchi ko ribbon ke beech tak khiskaiye</p><p class="msg" hidden aria-live="polite"></p><button class="go" type="button" hidden>Andar aaiye</button></div>'+
'<button class="skip" type="button" hidden>Skip</button>';

function init(){
  var st=document.createElement("style");st.textContent=CSS;document.head.appendChild(st);
  var fl=document.createElement("link");fl.rel="stylesheet";
  fl.href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap";
  document.head.appendChild(fl);

  var wm=document.createElement("div");wm.className="wm";
  wm.setAttribute("role","dialog");wm.setAttribute("aria-modal","true");wm.setAttribute("aria-label","Welcome");
  wm.innerHTML=HTML;document.body.appendChild(wm);
  var prevOv=document.documentElement.style.overflow;document.documentElement.style.overflow="hidden";

  function $(s){return wm.querySelector(s)}
  var kick=$(".kick"),nm=$(".nm"),sub=$(".sub"),rib=$(".rib"),sc=$(".sc"),hint=$(".hint"),
      msgEl=$(".msg"),go=$(".go"),skip=$(".skip"),fx=$(".fx");
  nm.textContent=NAME;
  if(preview)skip.hidden=false;

  var i,e;
  for(i=0;i<36;i++){e=document.createElement("i");e.className="st";
    e.style.cssText="left:"+Math.random()*100+"%;top:"+Math.random()*55+"%;--s:"+(1+Math.random()*2.2)+"px;--d:"+(2+Math.random()*3)+"s";fx.appendChild(e)}
  if(!RM)for(i=0;i<16;i++){e=document.createElement("i");e.className="pt";
    e.style.cssText="left:"+Math.random()*100+"%;--s:"+(8+Math.random()*9)+"px;--d:"+(9+Math.random()*8)+"s;--l:-"+(Math.random()*12)+"s;--x:"+(Math.random()*80-40)+"px";fx.appendChild(e)}

  function burst(n){
    if(RM)return;
    var r=rib.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    for(var k=0;k<n;k++){
      var p=document.createElement("i"),a=Math.random()*Math.PI*2,d=90+Math.random()*190,heart=k%4===0;
      p.className="cf"+(heart?" ht":"");if(heart)p.textContent="\u2665";
      p.style.cssText="left:"+cx+"px;top:"+cy+"px;--dx:"+Math.cos(a)*d+"px;--dy:"+(Math.sin(a)*d-80)+"px;--r:"+(Math.random()*720-360)+"deg;--c:"+COLORS[k%COLORS.length]+";--t:"+(1.4+Math.random()*1.4)+"s;--s:"+(6+Math.random()*8)+"px";
      wm.appendChild(p);(function(x){setTimeout(function(){x.remove()},3200)})(p);
    }
  }

  var cutDone=false;
  function cut(){
    if(cutDone)return;cutDone=true;drag=false;
    save("cut");wm.classList.add("cut");hint.hidden=true;
    if(navigator.vibrate)navigator.vibrate([40,30,80]);
    burst(70);setTimeout(openDoors,900);
  }
  function openDoors(){
    wm.classList.add("open");kick.textContent="Aapka apna mahal";sub.textContent="aapka swagat hai";
    setTimeout(function(){burst(40)},700);setTimeout(typeMsg,1600);
  }
  function typeMsg(){
    msgEl.hidden=false;var n=0;
    if(RM){msgEl.textContent=MSG;showGo();return}
    (function t(){n++;msgEl.textContent=MSG.slice(0,n);
      if(n<MSG.length)setTimeout(t,MSG.charAt(n-1)==="\n"?350:38);else showGo()})();
  }
  function showGo(){go.hidden=false;requestAnimationFrame(function(){go.classList.add("show")});go.focus({preventScroll:true})}
  function close(){wm.remove();document.documentElement.style.overflow=prevOv}
  go.onclick=function(){
    save("in");wm.classList.add("out");
    setTimeout(function(){close();if(GO_URL)location.href=GO_URL},700);
  };
  skip.onclick=function(){save("in");location.href=GO_URL};

  var drag=false,off=0;
  sc.addEventListener("pointerdown",function(ev){
    if(cutDone)return;drag=true;sc.classList.add("drag");sc.style.transition="none";
    off=ev.clientX-(parseFloat(sc.style.left)||10);sc.setPointerCapture(ev.pointerId);ev.preventDefault();
  });
  sc.addEventListener("pointermove",function(ev){
    if(!drag)return;var W=innerWidth,L=Math.max(6,Math.min(ev.clientX-off,W/2));
    sc.style.left=L+"px";sc.style.setProperty("--a",Math.abs(Math.sin(L/9))*20+"deg");
    if(L+58>=W/2)cut();
  });
  function end(){
    if(!drag)return;drag=false;sc.classList.remove("drag");
    if(!cutDone){sc.style.transition="left .45s cubic-bezier(.3,1.4,.5,1)";sc.style.left="10px";sc.style.setProperty("--a","0deg")}
  }
  sc.addEventListener("pointerup",end);sc.addEventListener("pointercancel",end);
  sc.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();cut()}});

  if(state==="cut"&&!preview){
    wm.classList.add("instant","cut","open");cutDone=true;hint.hidden=true;
    kick.textContent="Aapka apna mahal";sub.textContent="aapka swagat hai";
    msgEl.hidden=false;msgEl.textContent=MSG;showGo();
    setTimeout(function(){wm.classList.remove("instant")},80);
  }else sc.focus({preventScroll:true});
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
</body>
</html>
