<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Profile - Baatify</title>
<script>
window.V="?v="+Date.now();
document.write('<link rel="stylesheet" href="css/profile.css'+window.V+'">');
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  </defs>
</svg>

<header class="top">
  <a class="ic" href="chat.html" aria-label="Back to chats"><svg class="i"><use href="#i-back"/></svg></a>
  <b>Profile</b>
</header>

<p id="load" class="note">Loading…</p>

<main id="page" class="hide">
  <div class="pic">
    <div id="av" class="avl"></div>
    <button id="cam" class="camb" type="button" aria-label="Change photo"><svg class="i"><use href="#i-camera"/></svg></button>
  </div>

  <section class="card">
    <label for="n">Name</label>
    <input id="n" maxlength="40" autocomplete="name">
    <button class="btn" id="sn" type="button">Save name</button>
  </section>

  <section class="card">
    <label for="u">Username</label>
    <input id="u" autocapitalize="off" autocomplete="off">
    <div id="hint" class="hint"></div>
    <button class="btn" id="su" type="button">Save username</button>
  </section>

  <section class="card">
    <h2>Change password</h2>
    <input id="pc" type="password" placeholder="Current password" autocomplete="current-password" aria-label="Current password">
    <input id="pn" type="password" placeholder="New password (6+ characters)" autocomplete="new-password" aria-label="New password">
    <input id="pr" type="password" placeholder="Confirm new password" autocomplete="new-password" aria-label="Confirm new password">
    <label class="chk"><input type="checkbox" id="sp"> Show passwords</label>
    <button class="btn" id="spw" type="button">Change password</button>
  </section>
</main>
<div id="crop" class="hide">
  <div class="cbox">
    <p>Drag the square to move it. Drag a corner to resize (1:1)</p>
    <div id="cf">
      <img id="ci" alt="">
      <div id="cb">
        <i class="hd tl" data-h="tl"></i>
        <i class="hd tr" data-h="tr"></i>
        <i class="hd bl" data-h="bl"></i>
        <i class="hd br" data-h="br"></i>
      </div>
    </div>
    <div class="cbtn">
      <button id="cno" type="button">Cancel</button>
      <button id="cok" type="button" class="btn">Use photo</button>
    </div>
  </div>
</div>
<input type="file" id="pf" accept="image/*" class="hide">
<div id="toast" role="status"></div>
<script>import("./js/profile.js"+window.V)</script>
</body>
</html>
